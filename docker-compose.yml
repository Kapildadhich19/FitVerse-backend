services:
  postgres:
    image: postgres:16-alpine
    container_name: fitverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitverse
      POSTGRES_PASSWORD: fitverse
      POSTGRES_DB: fitverse
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ai-service:
    build:
      context: ../ai-service
    container_name: fitverse-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      MESHY_MODEL: ${MESHY_MODEL:-meshy-7.1}
      PORT: 8001
    ports:
      - '127.0.0.1:8001:8001'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
